name: JavaScript syntax checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check external JavaScript and inline HTML scripts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const os = require('node:os');
          const path = require('node:path');
          const files = fs.readdirSync('.').filter(f => f.endsWith('.js'));
          let failed = false;
          function check(name, code) {
            const tmp = path.join(os.tmpdir(), 'sxi-check-' + process.pid + '.js');
            fs.writeFileSync(tmp, code);
            const result = cp.spawnSync(process.execPath, ['--check', tmp], {encoding:'utf8'});
            fs.unlinkSync(tmp);
            if (result.status !== 0) {
              console.error('Syntax failure in ' + name + '\n' + result.stderr);
              failed = true;
            } else console.log('PASS ' + name);
          }
          for (const file of files) check(file, fs.readFileSync(file, 'utf8'));
          const html = fs.readFileSync('index.html','utf8');
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi;
          let match, n = 0;
          while ((match = re.exec(html)) !== null) {
            if (/\bsrc\s*=/.test(match[1]) || !match[2].trim()) continue;
            check('index.html inline script #' + (++n), match[2]);
          }
          if (failed) process.exitCode = 1;
          NODE
