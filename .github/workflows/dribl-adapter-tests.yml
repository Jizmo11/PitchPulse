name: Dribl fixture adapter tests
on:
  pull_request:
    paths:
      - 'dribl-fixture-adapter.js'
      - 'tests/dribl-fixture-adapter.test.cjs'
      - '.github/workflows/dribl-adapter-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check adapter syntax
        run: node --check dribl-fixture-adapter.js
      - name: Run adapter tests
        run: node --test tests/dribl-fixture-adapter.test.cjs
